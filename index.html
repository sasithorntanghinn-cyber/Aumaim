        function getLotsForStockIn(itemId, items, stockInList, stockOutList, excludeOutId = null) {
            const item = items.find(i => i.id === itemId);
            if (!item) return [];

            const relevantOuts = stockOutList.filter(o => o.itemId === itemId && o.id !== excludeOutId);
            const lots = [];

            if (item.initialBalance > 0) {
                const disbursedFromInitial = relevantOuts
                    .filter(o => !o.stockInId || o.stockInId === "INITIAL" || (o.selectedLotNo && o.selectedLotNo.startsWith("ยอดยกมา")))
                    .reduce((sum, o) => sum + Number(o.qty || 0), 0);
                
                const remainingInitial = item.initialBalance - disbursedFromInitial;

                lots.push({
                    id: "INITIAL",
                    docNo: "ยอดยกมา / สต๊อกเริ่มต้นปี 2570",
                    date: "ก่อนปีงบประมาณ 2570",
                    supplier: "สต๊อกยกมาต้นปี",
                    unitPrice: item.avgUnitPrice || 0,
                    receivedQty: item.initialBalance,
                    disbursedQty: disbursedFromInitial,
                    remainingQty: Math.max(0, remainingInitial),
                    displayText: `ยอดยกมา/ราคามาตรฐาน (฿${(item.avgUnitPrice || 0).toFixed(2)}) - คงเหลือเบิกได้ ${Math.max(0, remainingInitial)} ${item.unit}`
                });
            }

            const itemStockIns = stockInList.filter(i => i.itemId === itemId);
            itemStockIns.forEach(inItem => {
                const disbursedFromLot = relevantOuts
                    .filter(o => o.stockInId === inItem.id)
                    .reduce((sum, o) => sum + Number(o.qty || 0), 0);

                const remainingLot = Number(inItem.qty) - disbursedFromLot;

                lots.push({
                    id: inItem.id,
                    docNo: `รับเข้าเลขที่ ${inItem.docNo}`,
                    rawDocNo: inItem.docNo,
                    date: inItem.date,
                    supplier: inItem.supplier,
                    unitPrice: Number(inItem.unitPrice || 0),
                    receivedQty: Number(inItem.qty),
                    disbursedQty: disbursedFromLot,
                    remainingQty: Math.max(0, remainingLot),
                    displayText: `รับเข้าเลขที่ ${inItem.docNo} (วันที่ ${inItem.date}) (฿${Number(inItem.unitPrice).toFixed(2)}) - คงเหลือ ${Math.max(0, remainingLot)} ${item.unit}`
                });
            });

            return lots;
        }

                localStorage.setItem("hpc10_departments_v2570", JSON.stringify(departments));
            }, [departments]);

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const inventorySummary = useMemo(() => {
                return items.map(item => {
                    const itemStockIns = stockInList.filter(inItem => inItem.itemId === item.id);
                    const totalIn = itemStockIns.reduce((sum, inItem) => sum + Number(inItem.qty), 0);
                    
                    const itemStockOuts = stockOutList.filter(outItem => outItem.itemId === item.id);
                    const totalOut = itemStockOuts.reduce((sum, outItem) => sum + Number(outItem.qty), 0);
                    
                    const balance = item.initialBalance + totalIn - totalOut;

                    let weightedAvgPrice = item.avgUnitPrice;
                    if (itemStockIns.length > 0) {
                        const totalInValue = itemStockIns.reduce((sum, i) => sum + (Number(i.qty) * Number(i.unitPrice)), 0);
                        const initialVal = item.initialBalance * item.avgUnitPrice;
                        const totalQtyAll = item.initialBalance + totalIn;
                        if (totalQtyAll > 0) {
                            weightedAvgPrice = (initialVal + totalInValue) / totalQtyAll;
                        }
                    }

                    const totalValue = balance * weightedAvgPrice;
                    const isLowStock = balance <= item.minStock;
                    const lots = getLotsForStockIn(item.id, items, stockInList, stockOutList);

                    return {
                        ...item,
                        totalIn,
                        totalOut,
                        balance,
                        avgUnitPrice: weightedAvgPrice,
                        totalValue,
                        isLowStock,
                        stockIns: itemStockIns,
                        stockOuts: itemStockOuts,
                        lots
                    };
                });
            }, [items, stockInList, stockOutList]);

            const categoryBreakdown = useMemo(() => {
                return CATEGORIES.map(cat => {
                    const catItems = inventorySummary.filter(item => item.category === cat);
                    const itemCount = catItems.length;
                    const totalUnits = catItems.reduce((sum, item) => sum + item.balance, 0);
                    const totalValue = catItems.reduce((sum, item) => sum + item.totalValue, 0);
                    const lowStockCount = catItems.filter(item => item.isLowStock).length;

                    return {
                        categoryName: cat,
                        itemCount,
                        totalUnits,
                        totalValue,
                        lowStockCount,
                        items: catItems
                    };
                });
            }, [inventorySummary]);

            const totalInventoryValue = useMemo(() => {
                return inventorySummary.reduce((sum, item) => sum + item.totalValue, 0);
            }, [inventorySummary]);

            const lowStockCount = useMemo(() => {
                return inventorySummary.filter(item => item.isLowStock).length;
            }, [inventorySummary]);

            const handleOpenTimeline = (item) => {
                setTimelineItem(item);
                setShowTimelineModal(true);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-gradient-to-r from-emerald-900 via-teal-950 to-slate-900 text-white shadow-lg no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2.5 bg-emerald-600/35 border border-emerald-400/30 rounded-xl backdrop-blur-sm">
                                        <Icons.Building />
                                    </div>
                                    <div>
                                        <div className="flex items-center space-x-2">
                                            <span className="bg-emerald-500 text-slate-950 text-xs font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                                                ศูนย์อนามัยที่ 10 อุบลราชธานี (ปีงบประมาณ 2570)
                                            </span>
                                        </div>
                                        <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white mt-0.5">
                                            ระบบบริหารจัดการคลังพัสดุ
                                        </h1>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-3 self-end md:self-auto">
                                    <button 
                                        onClick={() => setShowAddDeptModal(true)}
                                        className="inline-flex items-center px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium bg-teal-700 hover:bg-teal-600 text-white shadow-sm transition active:scale-95 space-x-1.5"
                                        title="เพิ่มหน่วยงานที่ขอเบิก"
                                    >
                                        <Icons.UserPlus />
                                        <span>เพิ่มหน่วยงานเบิก</span>
                                    </button>

                                    <button 
                                        onClick={() => setShowAddInModal(true)}
                                        className="inline-flex items-center px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition active:scale-95 space-x-1.5"
                                    >
                                        <Icons.Plus />
                                        <span>บันทึกรับเข้า</span>
                                    </button>

                                    <button 
                                        onClick={() => setShowAddOutModal(true)}
                                        className="inline-flex items-center px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium bg-amber-600 hover:bg-amber-500 text-white shadow-sm transition active:scale-95 space-x-1.5"
                                    >
                                        <Icons.StockOut />
                                        <span>บันทึกเบิกจ่าย</span>
                                    </button>
                                </div>
                            </div>

                            <nav className="flex space-x-1 sm:space-x-2 overflow-x-auto mt-6 pt-2 border-t border-slate-800">
                                {[
                                    { id: "dashboard", label: "แผงควบคุม", icon: Icons.Dashboard },
                                    { id: "stock_in", label: "รับเข้าพัสดุ", icon: Icons.StockIn, count: stockInList.length },
                                    { id: "stock_balance", label: "ทะเบียน/คงเหลือ/ไทม์ไลน์", icon: Icons.StockBalance, count: items.length },
                                    { id: "category_summary", label: "สรุปหมวดหมู่ (16 หมวด)", icon: Icons.Folder, count: CATEGORIES.length },
                                    { id: "stock_out", label: "เบิกจ่ายพัสดุ", icon: Icons.StockOut, count: stockOutList.length },
                                    { id: "departments", label: "หน่วยงานเบิก", icon: Icons.Building, count: departments.length },
                                    { id: "reports", label: "รายงานทางการ", icon: Icons.Report },
                                    { id: "ai", label: "ผู้ช่วย AI พัสดุ", icon: Icons.AI }
                                ].map((tab) => {
                                    const Icon = tab.icon;
                                    const isActive = activeTab === tab.id;
                                    return (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`flex items-center space-x-2 px-3.5 py-2.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap transition ${
                                                isActive 
                                                    ? "bg-emerald-600 text-white shadow-md font-semibold" 
                                                    : "text-slate-300 hover:bg-slate-800/60 hover:text-white"
                                            }`}
                                        >
                                            <Icon />
                                            <span>{tab.label}</span>
                                            {tab.count !== undefined && (
                                                <span className={`ml-1 px-1.5 py-0.2 rounded-full text-[10px] ${isActive ? "bg-emerald-800 text-white" : "bg-slate-800 text-slate-400"}`}>
                                                    {tab.count}
                                                </span>
                                            )}
                                        </button>
                                    );
                                })}
                            </nav>
                        </div>
                    </header>

                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 flex items-center px-4 py-3 rounded-xl shadow-2xl border text-white animate-bounce ${
                            toast.type === "danger" ? "bg-rose-900 border-rose-700" : "bg-slate-900 border-slate-700"
                        }`}>
                            <Icons.CheckCircle />
                            <span className="ml-2.5 text-sm font-medium">{toast.message}</span>
                        </div>
                    )}

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 no-print">
                        {activeTab === "dashboard" && (
                            <DashboardView 
                                summary={inventorySummary}
                                categoryBreakdown={categoryBreakdown}
                                totalValue={totalInventoryValue}
                                lowStockCount={lowStockCount}
                                departmentsCount={departments.length}
                                onOpenAddIn={() => setShowAddInModal(true)}
                                onOpenAddOut={() => setShowAddOutModal(true)}
                                onOpenAddDept={() => setShowAddDeptModal(true)}
                                onNavigate={setActiveTab}
                                onOpenTimeline={handleOpenTimeline}
                            />
                        )}

                        {activeTab === "stock_in" && (
                            <StockInView 
                                stockInList={stockInList}
                                categories={CATEGORIES}
                                onOpenAddModal={() => setShowAddInModal(true)}
                                onEdit={(item) => setEditingStockIn(item)}
                                onDelete={(item) => setDeleteTarget({ type: 'stock_in', data: item })}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                            />
                        )}

                        {activeTab === "stock_balance" && (
                            <StockBalanceView 
                                summary={inventorySummary}
                                categories={CATEGORIES}
                                selectedCategory={selectedCategory}
                                setSelectedCategory={setSelectedCategory}
                                onOpenAddItem={() => setShowAddItemModal(true)}
                                onEditItem={(item) => setEditingItem(item)}
                                onDeleteItem={(item) => setDeleteTarget({ type: 'item', data: item })}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                                onOpenTimeline={handleOpenTimeline}
                            />
                        )}

                        {activeTab === "category_summary" && (
                            <CategorySummaryView 
                                breakdown={categoryBreakdown}
                                totalValue={totalInventoryValue}
                                onOpenAddItem={() => setShowAddItemModal(true)}
                                onEditItem={(item) => setEditingItem(item)}
                                onDeleteItem={(item) => setDeleteTarget({ type: 'item', data: item })}
                                onPrintCategory={(catName) => {
                                    setPrintCategoryName(catName);
                                    setPrintType("category_single");
                                    setShowPrintModal(true);
                                }}
                                onOpenTimeline={handleOpenTimeline}
                            />
                        )}

                        {activeTab === "stock_out" && (
                            <StockOutView 
                                stockOutList={stockOutList}
                                departments={departments}
                                categories={CATEGORIES}
                                onOpenAddModal={() => setShowAddOutModal(true)}
                                onOpenAddDept={() => setShowAddDeptModal(true)}
                                onEdit={(item) => setEditingStockOut(item)}
                                onDelete={(item) => setDeleteTarget({ type: 'stock_out', data: item })}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                            />
                        )}

                        {activeTab === "departments" && (
                            <DepartmentsView 
                                departments={departments}
                                stockOutList={stockOutList}
                                onOpenAddDept={() => setShowAddDeptModal(true)}
                                onDeleteDept={(deptName) => {
                                    if (departments.length <= 1) {
                                        showToast("ต้องมีหน่วยงานอย่างน้อย 1 หน่วยงานในระบบ", "danger");
                                        return;
                                    }
                                    setDepartments(departments.filter(d => d !== deptName));
                                    showToast(`ลบหน่วยงาน "${deptName}" เรียบร้อยแล้ว`, "danger");
                                }}
                            />
                        )}

                        {activeTab === "reports" && (
                            <ReportsView 
                                agencyName={agencyName}
                                summary={inventorySummary}
                                categoryBreakdown={categoryBreakdown}
                                totalValue={totalInventoryValue}
                                categories={CATEGORIES}
                                onPrint={(type, cat) => {
                                    setPrintType(type);
                                    if (cat) setPrintCategoryName(cat);
                                    setShowPrintModal(true);
                                }}
                            />
                        )}

                        {activeTab === "ai" && (
                            <AIAssistantView 
                                summary={inventorySummary}
                                categoryBreakdown={categoryBreakdown}
                                agencyName={agencyName}
                            />
                        )}
                    </main>

                    <footer className="bg-slate-900 text-slate-400 text-xs py-4 px-6 text-center border-t border-slate-800 no-print mt-auto">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
                            <div>
                                ศูนย์อนามัยที่ 10 อุบลราชธานี &copy; 2027 (ปีงบประมาณ 2570)
                            </div>
                            <div className="text-slate-500">
                                ระบบบริหารจัดการคลังพัสดุภาครัฐ (รองรับตรวจสอบวันรับเข้า-เบิกออกรายพัสดุ)
                            </div>
                        </div>
                    </footer>

                    {/* MODALS */}
                    {showAddInModal && (
                        <ModalAddStockIn 
                            items={items}
                            categories={CATEGORIES}
                            onClose={() => setShowAddInModal(false)}
                            onSubmit={(formData) => {
                                const totalAmount = Number(formData.qty) * Number(formData.unitPrice);
                                const newIn = {
                                    id: `IN-2570-${String(Date.now()).slice(-4)}`,
                                    ...formData,
                                    totalAmount,
                                    qty: Number(formData.qty),
                                    unitPrice: Number(formData.unitPrice)
                                };
                                setStockInList([newIn, ...stockInList]);
                                showToast(`บันทึกรับเข้าพัสดุเรียบร้อยแล้ว (เลขที่: ${newIn.docNo})`);
                                setShowAddInModal(false);
                            }}
                        />
                    )}

                    {showAddOutModal && (
                        <ModalAddStockOut 
                            items={items}
                            stockInList={stockInList}
                            stockOutList={stockOutList}
                            departments={departments}
                            categories={CATEGORIES}
                            onClose={() => setShowAddOutModal(false)}
                            onSubmit={(formData) => {
                                const totalAmount = Number(formData.qty) * Number(formData.unitPrice);
                                const newOut = {
                                    id: `OUT-2570-${String(Date.now()).slice(-4)}`,
                                    ...formData,
                                    qty: Number(formData.qty),
                                    unitPrice: Number(formData.unitPrice),
                                    totalAmount
                                };
                                setStockOutList([newOut, ...stockOutList]);
                                showToast(`บันทึกเบิกจ่ายสำเร็จ (ใบเบิก: ${newOut.reqNo})`);
                                setShowAddOutModal(false);
                            }}
                            onOpenAddDept={() => setShowAddDeptModal(true)}
                        />
                    )}

                    {showAddItemModal && (
                        <ModalAddNewItem 
                            categories={CATEGORIES}
                            units={UNITS}
                            items={items}
                            onClose={() => setShowAddItemModal(false)}
                            onSubmit={(formData) => {
                                const prefix = CATEGORY_PREFIXES[formData.category] || "GEN";
                                const existingInCat = items.filter(i => i.category === formData.category);
                                const runningNo = String(existingInCat.length + 1).padStart(3, '0');
                                const newId = `MAT-${prefix}-${runningNo}`;

                                const newItem = {
                                    id: newId,
                                    ...formData,
                                    minStock: Number(formData.minStock),
                                    initialBalance: Number(formData.initialBalance || 0),
                                    avgUnitPrice: Number(formData.avgUnitPrice || 0)
                                };
                                setItems([...items, newItem]);
                                showToast(`เพิ่มรายการพัสดุใหม่ "${newItem.name}" รหัส ${newId} สำเร็จ`);
                                setShowAddItemModal(false);
                            }}
                        />
                    )}

                    {showAddDeptModal && (
                        <ModalAddDepartment 
                            onClose={() => setShowAddDeptModal(false)}
                            onSubmit={(deptName) => {
                                if (departments.includes(deptName)) {
                                    showToast("มีหน่วยงานนี้อยู่ในระบบแล้ว", "danger");
                                    return;
                                }
                                setDepartments([...departments, deptName]);
                                showToast(`เพิ่มหน่วยงานขอเบิก "${deptName}" เรียบร้อยแล้ว`);
                                setShowAddDeptModal(false);
                            }}
                        />
                    )}

                    {editingStockIn && (
                        <ModalEditStockIn 
                            items={items}
                            categories={CATEGORIES}
                            record={editingStockIn}
                            onClose={() => setEditingStockIn(null)}
                            onSubmit={(updated) => {
                                const totalAmount = Number(updated.qty) * Number(updated.unitPrice);
                                setStockInList(stockInList.map(i => i.id === updated.id ? { ...updated, totalAmount, qty: Number(updated.qty), unitPrice: Number(updated.unitPrice) } : i));
                                showToast(`แก้ไขรายการรับเข้าสำเร็จ`);
                                setEditingStockIn(null);
                            }}
                        />
                    )}

                    {editingStockOut && (
                        <ModalEditStockOut 
                            items={items}
                            stockInList={stockInList}
                            stockOutList={stockOutList}
                            departments={departments}
                            categories={CATEGORIES}
                            record={editingStockOut}
                            onClose={() => setEditingStockOut(null)}
                            onSubmit={(updated) => {
                                const totalAmount = Number(updated.qty) * Number(updated.unitPrice);
                                setStockOutList(stockOutList.map(i => i.id === updated.id ? { ...updated, qty: Number(updated.qty), unitPrice: Number(updated.unitPrice), totalAmount } : i));
                                showToast(`แก้ไขรายการเบิกจ่ายสำเร็จ`);
                                setEditingStockOut(null);
                            }}
                        />
                    )}

                    {editingItem && (
                        <ModalEditItem 
                            categories={CATEGORIES}
                            units={UNITS}
                            item={editingItem}
                            onClose={() => setEditingItem(null)}
                            onSubmit={(updated) => {
                                setItems(items.map(i => i.id === updated.id ? { ...updated, minStock: Number(updated.minStock), initialBalance: Number(updated.initialBalance), avgUnitPrice: Number(updated.avgUnitPrice) } : i));
                                showToast(`อัปเดตข้อมูลพัสดุสำเร็จ`);
                                setEditingItem(null);
                            }}
                        />
                    )}

                    {deleteTarget && (
                        <ModalConfirmDelete 
                            target={deleteTarget}
                            onClose={() => setDeleteTarget(null)}
                            onConfirm={() => {
                                if (deleteTarget.type === 'stock_in') {
                                    setStockInList(stockInList.filter(i => i.id !== deleteTarget.data.id));
                                    showToast(`ลบรายการรับเข้าเรียบร้อย`, "danger");
                                } else if (deleteTarget.type === 'stock_out') {
                                    setStockOutList(stockOutList.filter(i => i.id !== deleteTarget.data.id));
                                    showToast(`ลบรายการเบิกจ่ายเรียบร้อย`, "danger");
                                } else if (deleteTarget.type === 'item') {
                                    setItems(items.filter(i => i.id !== deleteTarget.data.id));
                                    showToast(`ลบรายการพัสดุเรียบร้อย`, "danger");
                                }
                                setDeleteTarget(null);
                            }}
                        />
                    )}

                    {showTimelineModal && timelineItem && (
                        <ModalItemTimeline 
                            item={timelineItem}
                            stockInList={stockInList}
                            stockOutList={stockOutList}
                            onClose={() => {
                                setShowTimelineModal(false);
                                setTimelineItem(null);
                            }}
                        />
                    )}

                    {showPrintModal && (
                        <ModalPrintPreview 
                            type={printType}
                            agencyName={agencyName}
                            summary={inventorySummary}
                            categoryBreakdown={categoryBreakdown}
                            totalValue={totalInventoryValue}
                            categories={CATEGORIES}
                            printCategoryName={printCategoryName}
                            onClose={() => setShowPrintModal(false)}
                        />
                    )}
                </div>
            );
        }

        function DashboardView({ summary, categoryBreakdown, totalValue, lowStockCount, departmentsCount, onOpenAddIn, onOpenAddOut, onOpenAddDept, onNavigate, onOpenTimeline }) {
            const lowStockItems = summary.filter(i => i.isLowStock);

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">รายการพัสดุทั้งหมด</p>
                                <p className="text-2xl font-bold text-slate-900 mt-1">{summary.length} <span className="text-sm font-normal text-slate-500">รายการ</span></p>
                            </div>
                            <div className="p-3 bg-blue-50 text-blue-600 rounded-xl">
                                <Icons.StockBalance />
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">มูลค่าคลังพัสดุรวม</p>
                                <p className="text-2xl font-bold text-slate-900 mt-1">฿{totalValue.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
                            </div>
                            <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">หมวดหมู่พัสดุ</p>
                                <p className="text-2xl font-bold text-slate-900 mt-1">{CATEGORIES.length} <span className="text-sm font-normal text-slate-500">หมวด</span></p>
                            </div>
                            <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
                                <Icons.Folder />
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-teal-800 uppercase tracking-wider">หน่วยงานเบิก</p>
                                <p className="text-2xl font-bold text-teal-900 mt-1">{departmentsCount} <span className="text-sm font-normal text-teal-700">หน่วยงาน</span></p>
                            </div>
                            <div className="p-3 bg-teal-50 text-teal-700 rounded-xl">
                                <Icons.Building />
                            </div>
                        </div>

                        <div className={`p-5 rounded-2xl border shadow-sm flex items-center justify-between ${
                            lowStockCount > 0 ? "bg-amber-50/70 border-amber-200" : "bg-white border-slate-200"
                        }`}>
                            <div>
                                <p className="text-xs font-semibold text-amber-800 uppercase tracking-wider">ต้องสำรองเพิ่ม</p>
                                <p className="text-2xl font-bold text-amber-900 mt-1">{lowStockCount} <span className="text-sm font-normal text-amber-700">รายการ</span></p>
                            </div>
                            <div className="p-3 bg-amber-100 text-amber-700 rounded-xl">
                                <Icons.AlertTriangle />
                            </div>
                        </div>
                    </div>

                    {lowStockItems.length > 0 && (
                        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5 shadow-sm">
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex items-center space-x-2">
                                    <Icons.AlertTriangle />
                                    <h2 className="text-base font-semibold text-amber-900">

        function StockOutView({ stockOutList, departments, categories, onOpenAddModal, onOpenAddDept, onEdit, onDelete, searchTerm, setSearchTerm }) {
            const [selectedDeptFilter, setSelectedDeptFilter] = useState("ALL");
            const [selectedCatFilter, setSelectedCatFilter] = useState("ALL");

            const filtered = stockOutList.filter(item => {
                const matchesSearch = item.reqNo.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    item.itemName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    item.department.toLowerCase().includes(searchTerm.toLowerCase());
                
                const matchesDept = selectedDeptFilter === "ALL" || item.department === selectedDeptFilter;
                const matchesCat = selectedCatFilter === "ALL" || item.category === selectedCatFilter;
                return matchesSearch && matchesDept && matchesCat;

            return (
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

                                value={selectedCatFilter}

        function AIAssistantView({ summary, categoryBreakdown, agencyName }) {
            const [query, setQuery] = useState("");
            const [loading, setLoading] = useState(false);
            const [aiResponse, setAiResponse] = useState(
                "สวัสดีครับ ผมคือผู้ช่วยอัจฉริยะด้านพัสดุของ " + agencyName + " ประจำปีงบประมาณ 2570 มีข้อมูลพัสดุในคลังทั้งหมด " + summary.length + " รายการ มูลค่ารวม ฿" + summary.reduce((s, i) => s + i.totalValue, 0).toLocaleString() + " ยินดีให้คำแนะนำครับ"
            );

            const handleAskAI = (e) => {
                e.preventDefault();
                if (!query.trim()) return;

                setLoading(true);
                setTimeout(() => {
                    const q = query.toLowerCase();
                    let ans = "";
                    if (q.includes("ใกล้หมด") || q.includes("ต่ำ")) {
                        const low = summary.filter(i => i.isLowStock);
                        ans = `พัสดุที่ต่ำกว่าเกณฑ์สำรองประจำปี 2570 มีทั้งหมด ${low.length} รายการ ได้แก่: ` + low.map(i => `${i.name} (เหลือ ${i.balance} ${i.unit})`).join(", ");
                    } else if (q.includes("มูลค่า") || q.includes("แพง")) {
                        const sorted = [...summary].sort((a,b) => b.totalValue - a.totalValue);
                        ans = `พัสดุมูลค่ารวมสูงสุดในคลังคือ "${sorted[0]?.name}" มูลค่ารวม ฿${sorted[0]?.totalValue.toLocaleString()}`;
                    } else {
                        ans = `จากการวิเคราะห์คลังพัสดุของ ${agencyName} ในปี 2570 ขอแนะนำให้ตรวจสอบรายการวัสดุสำนักงานและเวชภัณฑ์อย่างสม่ำเสมอ เพื่อให้การเบิกจ่ายของหน่วยงานภายในเป็นไปอย่างราบรื่น`;
                    }
                    setAiResponse(ans);
                    setLoading(false);
                    setQuery("");
                }, 800);
            };

            return (
                <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6">
                    <div className="flex items-center space-x-3">
                        <div className="p-3 bg-emerald-100 text-emerald-800 rounded-2xl">
                            <Icons.AI />
                        </div>
                        <div>

        // Timeline Modal for checking exact Stock In and Stock Out dates per item
        function ModalItemTimeline({ item, stockInList, stockOutList, onClose }) {
            const itemIns = stockInList.filter(i => i.itemId === item.id);
            const itemOuts = stockOutList.filter(o => o.itemId === item.id);

            // Combine into a chronological timeline array
            const timelineEvents = [
                {
                    type: 'initial',
                    date: 'ก่อนปี 2570',
                    title: 'ยอดยกมาต้นปี 2570',
                    detail: `ยอดยกมาตั้งต้น ${item.initialBalance} ${item.unit} (ราคาเฉลี่ย ฿${Number(item.avgUnitPrice).toFixed(2)}/หน่วย)`,
                    badgeColor: 'bg-blue-100 text-blue-800 border-blue-200'
                },
                ...itemIns.map(i => ({
                    type: 'in',
                    date: i.date,
                    title: `รับเข้า: ${i.docNo}`,
                    detail: `รับเข้าจำนวน +${i.qty} ${item.unit} จาก "${i.supplier}" (ราคา ฿${Number(i.unitPrice).toFixed(2)}/หน่วย) ผู้รับ: ${i.receiver}`,
                    badgeColor: 'bg-emerald-100 text-emerald-800 border-emerald-200'
                })),
                ...itemOuts.map(o => ({
                    type: 'out',
                    date: o.date,
                    title: `เบิกจ่าย: ${o.reqNo}`,
                    detail: `เบิกจ่ายจำนวน -${o.qty} ${item.unit} ให้ "${o.department}" (ล็อต: ${o.selectedLotNo || '-'}) วัตถุประสงค์: ${o.purpose}`,
                    badgeColor: 'bg-amber-100 text-amber-900 border-amber-200'
                }))
            ].sort((a, b) => new Date(a.date) - new Date(b.date));

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden animate-in fade-in zoom-in duration-200 flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 bg-emerald-900 text-white flex justify-between items-center shrink-0">
                            <div>
                                <h3 className="font-bold text-base">ประวัติไทม์ไลน์ (วันรับเข้า - วันเบิกออก)</h3>
                                <p className="text-xs text-emerald-200">{item.name} [{item.id}] - หมวด: {item.category}</p>
                            </div>
                            <button onClick={onClose} className="text-emerald-200 hover:text-white"><Icons.X /></button>
                        </div>

                        <div className="p-6 overflow-y-auto space-y-4 text-xs sm:text-sm">
                            <div className="grid grid-cols-3 gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                <div>
                                    <p className="text-slate-500 text-[11px]">ยอดยกมา</p>
                                    <p className="font-bold text-slate-900">{item.initialBalance} {item.unit}</p>
                                </div>
                                <div>
                                    <p className="text-slate-500 text-[11px]">รับเข้ารวม</p>
                                    <p className="font-bold text-emerald-600">+{item.totalIn} {item.unit}</p>
                                </div>
                                <div>
                                    <p className="text-slate-500 text-[11px]">คงเหลือปัจจุบัน</p>
                                    <p className="font-bold text-slate-900 text-base">{item.balance} {item.unit}</p>
                                </div>
                            </div>

                            <div className="border-l-2 border-emerald-500 pl-4 space-y-6 my-4 ml-2">
                                {timelineEvents.length === 0 ? (
                                    <p className="text-slate-400">ยังไม่มีประวัติการเคลื่อนไหวพัสดุ</p>
                                ) : (
                                    timelineEvents.map((ev, idx) => (
                                        <div key={idx} className="relative pl-4">
                                            <div className="absolute -left-[21px] top-1 w-3.5 h-3.5 rounded-full bg-emerald-600 border-2 border-white"></div>
                                            <div className="flex items-center space-x-2">
                                                <span className={`px-2 py-0.5 rounded text-[11px] font-bold border ${ev.badgeColor}`}>
                                                    {ev.date}
                                                </span>
                                                <span className="font-bold text-slate-900">{ev.title}</span>
                                            </div>
                                            <p className="text-slate-600 mt-1 text-xs">{ev.detail}</p>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end shrink-0">
                            <button onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl text-xs">ปิดหน้าต่าง</button>
                        </div>
                    </div>
                </div>
            );
        }

        function ModalAddStockIn({ items, categories, onClose, onSubmit }) {
            const [selectedCategory, setSelectedCategory] = useState(categories[0]);
            const [itemSearchQuery, setItemSearchQuery] = useState("");

            const filteredItems = useMemo(() => {
                return items.filter(i => {
                    const matchesCat = i.category === selectedCategory;
                    const matchesQuery = i.name.toLowerCase().includes(itemSearchQuery.toLowerCase()) || 
                                         i.id.toLowerCase().includes(itemSearchQuery.toLowerCase());
                    return matchesCat && matchesQuery;
                });
            }, [items, selectedCategory, itemSearchQuery]);

            const [formData, setFormData] = useState({
                date: "2027-01-15",
                docNo: "บซ." + String(Math.floor(Math.random() * 900) + 100) + "/2570",
                supplier: "บริษัท สมาร์ทออฟฟิศ ซัพพลาย จำกัด",
                procurementMethod: "เฉพาะเจาะจง",
                itemId: "",
                qty: 10,
                unitPrice: 100,
                receiver: "เจ้าหน้าที่พัสดุ",
                note: ""
            });

            useEffect(() => {
                if (filteredItems.length > 0) {
                    const first = filteredItems[0];
                    setFormData(prev => ({
                        ...prev,
                        itemId: first.id,
                        unitPrice: first.avgUnitPrice || 100
                    }));
                } else {
                    setFormData(prev => ({
                        ...prev,
                        itemId: "",
                        unitPrice: 100
                    }));
                }
            }, [selectedCategory, itemSearchQuery]);

            const handleCategoryChange = (cat) => {
                setSelectedCategory(cat);
                setItemSearchQuery("");
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.itemId) {
                    alert("กรุณาเลือกรายการพัสดุรับเข้า");
                    return;
                }
                const selectedItem = items.find(i => i.id === formData.itemId);
                onSubmit({
                    ...formData,
                    itemName: selectedItem ? selectedItem.name : "พัสดุไม่ระบุ",
                    category: selectedCategory
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
                        <div className="px-6 py-4 bg-emerald-900 text-white flex justify-between items-center">
                            <h3 className="font-bold text-base">บันทึกรับเข้าพัสดุเข้าคลัง ปี 2570</h3>
                            <button onClick={onClose} className="text-emerald-200 hover:text-white"><Icons.X /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4 text-xs sm:text-sm">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">วันที่รับเข้า (ปี 2570)</label>
                                    <input 
                                        type="date"
                                        value={formData.date}
                                        onChange={(e) => setFormData({...formData, date: e.target.value})}
                                        className="w-full px-3 py-2 border rounded-xl"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">เลขที่เอกสาร / ใบส่งของ</label>
                                    <input 
                                        type="text"
                                        value={formData.docNo}
                                        onChange={(e) => setFormData({...formData, docNo: e.target.value})}
                                        className="w-full px-3 py-2 border rounded-xl"
                                        required
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">หมวดหมู่พัสดุ</label>
                                    <select 
                                        value={selectedCategory}
                                        onChange={(e) => handleCategoryChange(e.target.value)}
                                        className="w-full px-3 py-2 border rounded-xl bg-slate-50 font-medium"
                                    >
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">ค้นหา/เลือกรายการพัสดุ</label>
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
                                            <Icons.Search />
                                        </span>
                                        <input 
                                            type="text"
                                            placeholder="พิมพ์ค้นหาชื่อพัสดุ..."
                                            value={itemSearchQuery}
                                            onChange={(e) => setItemSearchQuery(e.target.value)}
                                            className="w-full pl-8 pr-3 py-1.5 border rounded-xl text-xs mb-1.5 bg-slate-50"
                                        />
                                    </div>
                                    <select 
                                        value={formData.itemId}
                                        onChange={(e) => {
                                            const found = items.find(i => i.id === e.target.value);
                                            setFormData({...formData, itemId: e.target.value, unitPrice: found ? found.avgUnitPrice : 100});
                                        }}
                                        className="w-full px-3 py-2 border rounded-xl font-medium bg-white"
                                        required
                                    >
                                        {filteredItems.length === 0 ? (
                                            <option value="">-- ไม่พบพัสดุในหมวดหมู่นี้ --</option>
                                        ) : (
                                            filteredItems.map(i => <option key={i.id} value={i.id}>{i.name} ({i.id})</option>)
                                        )}
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">จำนวนที่รับเข้า</label>
                                    <input 
                                        type="number"
                                        min="1"
                                        value={formData.qty}
                                        onChange={(e) => setFormData({...formData, qty: e.target.value})}
                                        className="w-full px-3 py-2 border rounded-xl"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">ราคาต่อหน่วย (บาท)</label>
                                    <input 
                                        type="number"
                                        step="0.01"
                                        min="0"
                                        value={formData.unitPrice}
                                        onChange={(e) => setFormData({...formData, unitPrice: e.target.value})}
                                        className="w-full px-3 py-2 border rounded-xl"
                                        required
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block font-semibold text-slate-700 mb-1">ผู้จำหน่าย / ร้านค้า</label>
                                <input 
                                    type="text"
                                    value={formData.supplier}
                                    onChange={(e) => setFormData({...formData, supplier: e.target.value})}
                                    className="w-full px-3 py-2 border rounded-xl"
                                    required
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">วิธีจัดซื้อจัดจ้าง</label>
                                    <select 
                                        value={formData.procurementMethod}
                                        onChange={(e) => setFormData({...formData, procurementMethod: e.target.value})}
                                        className="w-full px-3 py-2 border rounded-xl"
                                    >
                                        <option value="เฉพาะเจาะจง">เฉพาะเจาะจง</option>
                                        <option value="E-bidding">E-bidding</option>
                                        <option value="คัดเลือก">คัดเลือก</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">ผู้ตรวจรับพัสดุ</label>
                                    <input 
                                        type="text"
                                        value={formData.receiver}
                                        onChange={(e) => setFormData({...formData, receiver: e.target.value})}
                                        className="w-full px-3 py-2 border rounded-xl"
                                        required
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block font-semibold text-slate-700 mb-1">หมายเหตุ / วัตถุประสงค์</label>
                                <input 
                                    type="text"
                                    value={formData.note}
                                    onChange={(e) => setFormData({...formData, note: e.target.value})}
                                    className="w-full px-3 py-2 border rounded-xl"
                                    placeholder="ระบุเพิ่มเติม (ถ้ามี)"
                                />
                            </div>

                            <div className="flex justify-end space-x-2 pt-4">
                                <button type="button" onClick={onClose} className="px-4 py-2 border rounded-xl text-slate-600 hover:bg-slate-100">ยกเลิก</button>
                                <button type="submit" className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-sm">บันทึกรับเข้า</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ModalAddStockOut({ items, stockInList, stockOutList, departments, categories, onClose, onSubmit, onOpenAddDept }) {
            const [selectedCategory, setSelectedCategory] = useState(categories[0]);
            const [itemSearchQuery, setItemSearchQuery] = useState("");

            const filteredItems = useMemo(() => {
                return items.filter(i => {
                    const matchesCat = i.category === selectedCategory;
                    const matchesQuery = i.name.toLowerCase().includes(itemSearchQuery.toLowerCase()) || 
                                         i.id.toLowerCase().includes(itemSearchQuery.toLowerCase());
                    return matchesCat && matchesQuery;
                });
            }, [items, selectedCategory, itemSearchQuery]);

            const [formData, setFormData] = useState({
                date: "2027-02-10",
                reqNo: "บก." + String(Math.floor(Math.random() * 900) + 100) + "/2570",
                department: departments[0] || "ฝ่ายบริหารงานทั่วไป",
                itemId: "",
                qty: 1,
                unitPrice: 100,
                selectedLotNo: "",
                stockInId: "",
                requester: "เจ้าหน้าที่ผู้ขอเบิก",
                purpose: "ใช้ในการปฏิบัติงานประจำปี 2570"
            });

            const currentLots = useMemo(() => {
                if (!formData.itemId) return [];
                return getLotsForStockIn(formData.itemId, items, stockInList, stockOutList);
            }, [formData.itemId, items, stockInList, stockOutList]);

            useEffect(() => {
                if (filteredItems.length > 0) {
                    const first = filteredItems[0];
                    const lots = getLotsForStockIn(first.id, items, stockInList, stockOutList);
                    const defaultLot = lots.length > 0 ? lots[0] : null;

                    setFormData(prev => ({
                        ...prev,
                        itemId: first.id,
                        unitPrice: defaultLot ? defaultLot.unitPrice : first.avgUnitPrice,
                        selectedLotNo: defaultLot ? defaultLot.displayText : "ล็อตมาตรฐาน",
                        stockInId: defaultLot ? defaultLot.id : "INITIAL"
                    }));
                } else {
                    setFormData(prev => ({
                        ...prev,
                        itemId: "",
                        selectedLotNo: "",
                        stockInId: ""
                    }));
                }
            }, [selectedCategory, itemSearchQuery]);

            const handleItemChange = (itemId) => {
                const lots = getLotsForStockIn(itemId, items, stockInList, stockOutList);
                const defaultLot = lots.length > 0 ? lots[0] : null;

                setFormData(prev => ({
                    ...prev,
                    itemId,
                    unitPrice: defaultLot ? defaultLot.unitPrice : 100,
                    selectedLotNo: defaultLot ? defaultLot.displayText : "ล็อตมาตรฐาน",
                    stockInId: defaultLot ? defaultLot.id : "INITIAL"
                }));
            };

            const handleLotChange = (lotId) => {
                const lot = currentLots.find(l => l.id === lotId);
                if (lot) {
                    setFormData(prev => ({
                        ...prev,
                        stockInId: lot.id,
                        selectedLotNo: lot.displayText,
                        unitPrice: lot.unitPrice
                    }));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.itemId) {
                    alert("กรุณาเลือกพัสดุที่จะเบิก");
                    return;
                }
                const selectedItem = items.find(i => i.id === formData.itemId);
                onSubmit({
                    ...formData,
                    itemName: selectedItem ? selectedItem.name : "พัสดุ",
                    category: selectedCategory
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
                        <div className="px-6 py-4 bg-amber-600 text-white flex justify-between items-center">
                            <h3 className="font-bold text-base">บันทึกเบิกจ่ายพัสดุ ปี 2570 (ตัดสต๊อกตามล็อตรับเข้า)</h3>
                            <button onClick={onClose} className="text-amber-100 hover:text-white"><Icons.X /></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4 text-xs sm:text-sm">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">วันที่เบิกออก (ปี 2570)</label>
                                    <input 
                                        type="date"
                                        value={formData.date}
                                        onChange={(e) => setFormData({...formData, date: e.target.value})}
                                        className="w-full px-3 py-2 border rounded-xl"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">เลขที่ใบเบิก</label>
                                    <input 
                                        type="text"
                                        value={formData.reqNo}
                                        onChange={(e) => setFormData({...formData, reqNo: e.target.value})}
                                        className="w-full px-3 py-2 border rounded-xl"
                                        required
                                    />
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="font-semibold text-slate-700">หน่วยงานที่ขอเบิก</label>
                                    <button type="button" onClick={onOpenAddDept} className="text-[11px] text-teal-700 font-semibold hover:underline">
                                        + เพิ่มหน่วยงานใหม่
                                    </button>
                                </div>
                                <select 
                                    value={formData.department}
                                    onChange={(e) => setFormData({...formData, department: e.target.value})}
                                    className="w-full px-3 py-2 border rounded-xl bg-slate-50 font-medium"
                                    required
                                >
                                    {departments.map(d => <option key={d} value={d}>{d}</option>)}
                                </select>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">หมวดหมู่พัสดุ</label>
                                    <select 
                                        value={selectedCategory}
                                        onChange={(e) => {
                                            setSelectedCategory(e.target.value);
                                            setItemSearchQuery("");
                                        }}
                                        className="w-full px-3 py-2 border rounded-xl bg-slate-50 font-medium"
                                    >
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-semibold text-slate-700 mb-1">ค้นหา/เลือกรายการพัสดุ</label>
                                    <input 
                                        type="text"
                                        placeholder="พิมพ์ค้นหาชื่อ..."
                                        value={itemSearchQuery}
                                        onChange={(e) => setItemSearchQuery(e.target.value)}
                                        className="w-full px-3 py-1.5 border rounded-xl text-xs mb-1.5 bg-slate-50"
                                    />
                                    <select 
                                        value={formData.itemId}
                                        onChange={(e) => handleItemChange(e.target.value)}
                                        className="w-full px-3 py-2 border rounded-xl font-medium bg-white"
                                        required
                                    >
                                        {filteredItems.length === 0 ? (
                                            <option value="">-- ไม่พบพัสดุ --</option>
                                        ) : (
                                            filteredItems.map(i => <option key={i.id} value={i.id}>{i.name} (คงเหลือ {i.balance})</option>)
                                        )}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block font-semibold text-slate-700 mb-1">เลือกวันที่รับเข้า / ล็อตที่ต้องการตัดสต๊อก</label>
                                <select

                                        <th className="border border-slate-400 p-2 text-left">รายการพัสดุ</th>
                                        <th className="border border-slate-400 p-2 text-center">หมวดหมู่</th>
                                        <th className="border border-slate-400 p-2 text-center">หน่วยนับ</th>
                                        <th className="border border-slate-400 p-2 text-right">คงเหลือ</th>
                                        <th className="border border-slate-400 p-2 text-right">ราคาเฉลี่ย</th>
                                        <th className="border border-slate-400 p-2 text-right">มูลค่ารวม (บาท)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {printData.length === 0 ? (
                                        <tr>
                                            <td colSpan="8" className="border border-slate-400 p-6 text-center text-slate-500">ไม่พบข้อมูลในรายงานนี้</td>
                                        </tr>
                                    ) : (
                                        printData.map((item, index) => (
                                            <tr key={item.id} className="hover:bg-slate-50">
                                                <td className="border border-slate-400 p-2 text-center">{index + 1}</td>
                                                <td className="border border-slate-400 p-2 text-center font-mono">{item.id}</td>
                                                <td className="border border-slate-400 p-2 font-medium">{item.name}</td>
                                                <td className="border border-slate-400 p-2 text-center">{item.category}</td>
                                                <td className="border border-slate-400 p-2 text-center">{item.unit}</td>
                                                <td className="border border-slate-400 p-2 text-right font-bold">{item.balance}</td>
                                                <td className="border border-slate-400 p-2 text-right">฿{Number(item.avgUnitPrice).toFixed(2)}</td>
                                                <td className="border border-slate-400 p-2 text-right font-bold">฿{item.totalValue.toLocaleString('th-TH', { minimumFractionDigits: 2 })}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>

                            <div className="flex justify-between items-center pt-4 font-bold text-sm">
                                <div>รวมมูลค่าพัสดุทั้งสิ้น:</div>
                                <div>฿{printData.reduce((s, i) => s + i.totalValue, 0).toLocaleString('th-TH', { minimumFractionDigits: 2 })} บาท</div>
                            </div>
                        </div>

                        <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end no-print shrink-0">
                            <button onClick={onClose} className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-xl">ปิดหน้าต่าง</button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
